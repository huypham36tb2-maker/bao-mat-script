<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lua Source Paste</title>
  
  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/lua/lua.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

  <style>
    :root {
      --bg: #0f0f11; --panel: #18181b; --border: #27272a; --text: #f4f4f5;
      --muted: #a1a1aa; --primary: #3b82f6; --primary-hover: #2563eb;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg); }
    .logo { font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
    
    /* Banner */
    .banner-container { padding: 16px 24px 0; max-width: 1000px; margin: 0 auto; width: 100%; }
    .banner { width: 100%; height: 140px; border-radius: 8px; background: url('https://www.image2url.com/r2/default/gifs/1792619935669-6803e9fd-f753-4013-8516-5e35b55ddcc0.gif') center/cover; border: 1px solid var(--border); }

    /* Tabs */
    .nav-tabs { display: flex; gap: 24px; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--bg); max-width: 1000px; margin: 16px auto 0; width: 100%; }
    .nav-item { padding: 12px 0; color: var(--muted); font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .nav-item:hover { color: var(--text); }
    .nav-item.active { color: var(--text); border-bottom-color: var(--primary); }

    /* Main Content */
    main { flex: 1; padding: 24px; display: flex; flex-direction: column; max-width: 1000px; margin: 0 auto; width: 100%; }
    
    /* Form */
    .input-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    input[type="text"], select {
      background: var(--panel); border: 1px solid var(--border); color: var(--text);
      padding: 10px 14px; border-radius: 6px; font-size: 14px; outline: none; transition: border 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary); }
    .input-file { flex: 1; min-width: 200px; }

    /* Editor */
    .editor-wrapper { flex: 1; min-height: 350px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 16px; display: flex; flex-direction: column; }
    .CodeMirror { height: 100% !important; font-family: 'Fira Code', 'Courier New', monospace !important; font-size: 14px !important; }

    /* Options & Buttons */
    .options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    
    .btn { padding: 10px 20px; border-radius: 6px; border: none; font-weight: 500; font-size: 14px; cursor: pointer; color: white; transition: background 0.2s; }
    .btn-primary { background: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    
    /* Modal & Toast */
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; align-items: center; justify-content: center; }
    .modal-content { background: var(--panel); border: 1px solid var(--border); padding: 24px; border-radius: 8px; width: 100%; max-width: 450px; }
    .modal-content h3 { margin-bottom: 16px; font-size: 18px; }
    .modal-content input { width: 100%; margin-bottom: 16px; }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 12px 24px; border-radius: 6px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100; }
    #toast.show { opacity: 1; }
    
    footer { padding: 24px; text-align: center; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; margin-top: auto; }

    /* Giao diện Xem Code (Trình duyệt mở link) */
    #view-source { display: none; padding: 24px; max-width: 1000px; margin: 0 auto; width: 100%; }
    .source-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .source-title { font-size: 18px; font-weight: bold; color: var(--primary); }
    .btn-copy { background: #22c55e; color: white; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
    .btn-copy:hover { background: #16a34a; }
  </style>
</head>
<body>

  <!-- GIAO DIỆN CHÍNH (TẠO LINK) -->
  <div id="main-app">
    <header>
      <div class="logo">Lua Source Paste</div>
    </header>

    <div class="banner-container">
      <div class="banner"></div>
    </div>

    <div class="nav-tabs" id="nav-tabs">
      <div class="nav-item active" onclick="switchTab(event, 'upload')">Đăng tải</div>
    </div>

    <main id="view-upload">
      <div class="input-row">
        <input type="text" id="filename" class="input-file" value="script.lua" placeholder="Tên file (VD: script.lua)">
      </div>

      <div class="editor-wrapper">
        <textarea id="code"></textarea>
      </div>

      <div class="options">
        <div></div>
        <button class="btn btn-primary" id="submitBtn">Tạo Link</button>
      </div>
    </main>

    <footer>
      &copy; 2024 Lua Paste. Dữ liệu lưu trữ bảo mật.
    </footer>
  </div>

  <!-- GIAO DIỆN XEM SOURCE (KHI MỞ LINK) -->
  <div id="view-source">
    <div class="source-header">
      <div class="source-title" id="view-filename">script.lua</div>
      <button class="btn-copy" onclick="copySource()">Copy Code</button>
    </div>
    <div class="editor-wrapper" style="height: 70vh;">
      <textarea id="source-code"></textarea>
    </div>
  </div>

  <!-- Modal & Toast -->
  <div id="modal">
    <div class="modal-content">
      <h3>Tạo link thành công</h3>
      <input type="text" id="raw-link" readonly onclick="this.select()">
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-primary" style="flex:1" onclick="copyLink()">Copy Link</button>
        <button class="btn" style="background:var(--border); flex:1" onclick="closeModal()">Đóng</button>
      </div>
    </div>
  </div>
  <div id="toast">Thông báo</div>

  <script>
    // ===== KHỞI TẠO EDITOR =====
    const editor = CodeMirror.fromTextArea(document.getElementById('code'), {
      mode: "lua", theme: "dracula", lineNumbers: true, autoCloseBrackets: true, lineWrapping: true, indentUnit: 4
    });

    // Editor cho phần xem source
    let sourceEditor;
    
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function copyLink() { 
      navigator.clipboard.writeText(document.getElementById('raw-link').value);
      toast('Đã copy link!');
    }

    // ===== TẠO LINK (GỬI LÊN GITHUB GIST) =====
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const code = editor.getValue();
      let filename = document.getElementById('filename').value.trim() || 'script.lua';
      if (!filename.includes('.')) filename += '.lua';

      if (!code.trim()) return toast('Vui lòng nhập code!');

      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Đang xử lý...'; btn.disabled = true;

      try {
        // Gửi lên GitHub Gist (Ẩn danh)
        const res = await fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            description: "Lua Script Paste",
            public: false,
            files: {
              [filename]: { content: code }
            }
          })
        });

        if (!res.ok) throw new Error('Lỗi API');
        const data = await res.json();
        
        // Tạo link dẫn tới chính web của bạn
        const rawUrl = `${window.location.origin}${window.location.pathname}?raw=${data.id}`;

        document.getElementById('raw-link').value = rawUrl;
        document.getElementById('modal').style.display = 'flex';
        editor.setValue('');
      } catch (err) {
        toast('Lỗi khi kết nối tới Server!');
        console.error(err);
      } finally {
        btn.textContent = 'Tạo Link'; btn.disabled = false;
      }
    });

    // ===== XỬ LÝ XEM LINK RAW =====
    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const rawId = urlParams.get('raw');
      
      if (rawId) {
        // Ẩn trang chủ, hiện trang xem code
        document.getElementById('main-app').style.display = 'none';
        document.getElementById('view-source').style.display = 'block';

        try {
          const res = await fetch(`https://api.github.com/gists/${rawId}`);
          if (!res.ok) throw new Error('Not Found');
          
          const data = await res.json();
          const fileKey = Object.keys(data.files)[0]; // Lấy tên file
          const codeContent = data.files[fileKey].content;

          // Hiển thị tên file
          document.getElementById('view-filename').textContent = fileKey;

          // Khởi tạo CodeMirror cho phần xem
          sourceEditor = CodeMirror.fromTextArea(document.getElementById('source-code'), {
            mode: "lua", theme: "dracula", lineNumbers: true, readOnly: true, lineWrapping: true
          });
          
          // Đổ code vào
          sourceEditor.setValue(codeContent);
          
          // (Tùy chọn) Cập nhật lại kích thước cho editor
          setTimeout(() => sourceEditor.refresh(), 100);

        } catch (e) {
          document.getElementById('view-filename').textContent = "Lỗi";
          document.getElementById('view-source').innerHTML = '<h1 style="color:red; padding:20px;">404 - Không tìm thấy code!</h1>';
        }
      }
    });

    // Hàm Copy Code cho phần xem
    function copySource() {
      if(sourceEditor) {
        const code = sourceEditor.getValue();
        navigator.clipboard.writeText(code);
        toast('Đã copy toàn bộ code!');
      }
    }
  </script>
</body>
</html>
